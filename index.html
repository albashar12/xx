<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CipherVault | Zero-Knowledge Secure Vault</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header / Navigation -->
  <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg border border-indigo-500/20">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">CipherVault</span>
          <span class="text-xs px-2 py-0.5 ml-1.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">AES-256-GCM</span>
        </div>
      </div>
      <div id="header-actions" class="hidden flex items-center space-x-3">
        <button id="btn-export" title="Export Encrypted Backup" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition">
          <i data-lucide="download" class="w-5 h-5"></i>
        </button>
        <button id="btn-lock" class="flex items-center space-x-2 px-3.5 py-1.5 text-sm bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 rounded-lg border border-rose-500/20 transition">
          <i data-lucide="lock" class="w-4 h-4"></i>
          <span>Lock Vault</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

    <!-- 1. AUTH / UNLOCK SCREEN -->
    <div id="auth-screen" class="max-w-md w-full mx-auto glass p-8 rounded-2xl shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 rounded-2xl bg-indigo-500/10 text-indigo-400 ring-1 ring-indigo-500/20 mb-2">
          <i data-lucide="key-round" class="w-8 h-8"></i>
        </div>
        <h2 id="auth-title" class="text-2xl font-bold tracking-tight">Unlock Your Vault</h2>
        <p id="auth-subtitle" class="text-sm text-slate-400">All data is encrypted in your browser using PBKDF2 & AES-GCM.</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Master Password</label>
          <div class="relative">
            <input type="password" id="master-password" required placeholder="Enter your passphrase..."
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
            <button type="button" id="toggle-auth-pwd" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div id="confirm-pwd-group" class="hidden">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirm Master Password</label>
          <input type="password" id="confirm-password" placeholder="Repeat your passphrase..."
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
        </div>

        <div id="auth-error" class="hidden text-xs text-rose-400 bg-rose-500/10 p-2.5 rounded-lg border border-rose-500/20"></div>

        <button type="submit" id="auth-submit-btn" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/25 transition">
          Unlock Vault
        </button>
      </form>
    </div>

    <!-- 2. VAULT DASHBOARD SCREEN -->
    <div id="dashboard-screen" class="hidden flex-1 space-y-6">
      
      <!-- Toolbar -->
      <div class="flex flex-col sm:flex-row gap-4 items-stretch sm:items-center justify-between">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-500"></i>
          <input type="text" id="search-input" placeholder="Search passwords, accounts, or notes..."
            class="w-full pl-10 pr-4 py-2 bg-slate-900 border border-slate-800 rounded-xl text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />
        </div>

        <div class="flex items-center space-x-3">
          <!-- Filter Tabs -->
          <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
            <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-lg font-medium bg-indigo-600 text-white">All</button>
            <button data-filter="login" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200">Logins</button>
            <button data-filter="note" class="filter-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-slate-200">Notes</button>
          </div>

          <button id="btn-add-item" class="flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl shadow-lg shadow-indigo-600/20 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Add Item</span>
          </button>
        </div>
      </div>

      <!-- Item Grid / Empty State -->
      <div id="items-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered dynamically -->
      </div>
      <div id="empty-state" class="hidden text-center py-16 space-y-3">
        <div class="inline-flex p-4 rounded-full bg-slate-900 text-slate-600">
          <i data-lucide="folder-lock" class="w-8 h-8"></i>
        </div>
        <p class="text-slate-400 font-medium">No encrypted items found</p>
        <p class="text-xs text-slate-500">Click "Add Item" to store a credential or private secure note.</p>
      </div>

    </div>
  </main>

  <!-- 3. ADD / EDIT MODAL -->
  <div id="item-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="glass max-w-lg w-full rounded-2xl p-6 shadow-2xl border border-slate-800 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <h3 id="modal-title" class="font-semibold text-lg">Add New Secret</h3>
        <button id="modal-close" class="text-slate-400 hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="item-form" class="space-y-4">
        <input type="hidden" id="item-id" />
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Type</label>
            <select id="item-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500">
              <option value="login">Login / Password</option>
              <option value="note">Secure Note</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Title / Service</label>
            <input type="text" id="item-title" required placeholder="e.g. GitHub, AWS, Personal Note"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500" />
          </div>
        </div>

        <div id="login-fields" class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Username / Email</label>
            <input type="text" id="item-username" placeholder="user@example.com"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500" />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs text-slate-400">Password</label>
              <button type="button" id="btn-generate-pwd" class="text-xs text-indigo-400 hover:text-indigo-300">Generate Strong</button>
            </div>
            <div class="relative">
              <input type="password" id="item-password" placeholder="••••••••••••"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500" />
              <button type="button" id="toggle-item-pwd" class="absolute right-3 top-2 text-slate-500 hover:text-slate-300">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Secure Notes / Content</label>
          <textarea id="item-notes" rows="3" placeholder="Encrypted payload, recovery codes, or private notes..."
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 text-sm rounded-lg hover:bg-slate-800 text-slate-300 transition">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white shadow-md transition">Save & Encrypt</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 hidden items-center space-x-2 px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl text-xs text-slate-200 transition-all z-50">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-msg">Copied to clipboard!</span>
  </div>

  <!-- Application Logic (Web Crypto & State Management) -->
  <script>
    // --- 1. CRYPTO ENGINE (Zero-Knowledge AES-256-GCM + PBKDF2) ---
    class CryptoEngine {
      static async deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      static async encrypt(plainText, key) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = new TextEncoder();
        const cipherBuffer = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          enc.encode(plainText)
        );
        return {
          iv: Array.from(iv),
          data: Array.from(new Uint8Array(cipherBuffer))
        };
      }

      static async decrypt(encryptedPayload, key) {
        const iv = new Uint8Array(encryptedPayload.iv);
        const data = new Uint8Array(encryptedPayload.data);
        const decryptedBuffer = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          data
        );
        const dec = new TextDecoder();
        return dec.decode(decryptedBuffer);
      }
    }

    // --- 2. STATE & STORAGE MANAGEMENT ---
    const STORAGE_KEY = 'ciphervault_payload_v1';
    let currentKey = null;
    let vaultItems = [];
    let activeFilter = 'all';

    function hasExistingVault() {
      return localStorage.getItem(STORAGE_KEY) !== null;
    }

    async function saveVault() {
      if (!currentKey) return;
      const json = JSON.stringify(vaultItems);
      const encrypted = await CryptoEngine.encrypt(json, currentKey);
      const salt = JSON.parse(localStorage.getItem(STORAGE_KEY)).salt;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ salt, payload: encrypted }));
    }

    // --- 3. UI RENDERING & ACTIONS ---
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2500);
    }

    function renderItems() {
      const container = document.getElementById('items-container');
      const emptyState = document.getElementById('empty-state');
      const query = document.getElementById('search-input').value.toLowerCase();

      const filtered = vaultItems.filter(item => {
        const matchesType = activeFilter === 'all' || item.type === activeFilter;
        const matchesSearch = item.title.toLowerCase().includes(query) ||
          (item.username && item.username.toLowerCase().includes(query)) ||
          (item.notes && item.notes.toLowerCase().includes(query));
        return matchesType && matchesSearch;
      });

      container.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'glass p-5 rounded-2xl flex flex-col justify-between hover:border-slate-700 transition space-y-4';
          
          const isLogin = item.type === 'login';
          card.innerHTML = `
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs px-2 py-0.5 rounded-full font-medium ${isLogin ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                  ${isLogin ? 'Login' : 'Note'}
                </span>
                <div class="flex space-x-1">
                  <button onclick="editItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-slate-200 rounded-lg hover:bg-slate-800 transition"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                  <button onclick="deleteItem('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
              </div>
              <h4 class="font-semibold text-slate-100 text-base">${escapeHtml(item.title)}</h4>
              ${isLogin && item.username ? `<p class="text-xs text-slate-400 font-mono">${escapeHtml(item.username)}</p>` : ''}
              ${item.notes ? `<p class="text-xs text-slate-400 line-clamp-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800">${escapeHtml(item.notes)}</p>` : ''}
            </div>

            ${isLogin ? `
            <div class="flex items-center space-x-2 pt-2 border-t border-slate-800/80">
              <button onclick="copyToClipboard('${escapeAttr(item.password)}', 'Password copied!')" class="flex-1 flex items-center justify-center space-x-1.5 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 rounded-lg transition">
                <i data-lucide="key" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span>Copy Password</span>
              </button>
              ${item.username ? `
              <button onclick="copyToClipboard('${escapeAttr(item.username)}', 'Username copied!')" class="p-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-slate-200 rounded-lg transition" title="Copy Username">
                <i data-lucide="user" class="w-4 h-4"></i>
              </button>` : ''}
            </div>` : ''}
          `;
          container.appendChild(card);
        });
      }
      lucide.createIcons();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeAttr(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    window.copyToClipboard = (text, msg) => {
      navigator.clipboard.writeText(text);
      showToast(msg);
    };

    window.deleteItem = async (id) => {
      if (confirm('Permanently delete this secret?')) {
        vaultItems = vaultItems.filter(i => i.id !== id);
        await saveVault();
        renderItems();
      }
    };

    window.editItem = (id) => {
      const item = vaultItems.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modal-title').textContent = 'Edit Secret';
      document.getElementById('item-id').value = item.id;
      document.getElementById('item-type').value = item.type;
      document.getElementById('item-title').value = item.title;
      document.getElementById('item-username').value = item.username || '';
      document.getElementById('item-password').value = item.password || '';
      document.getElementById('item-notes').value = item.notes || '';
      toggleModalFields();
      document.getElementById('item-modal').classList.remove('hidden');
    };

    function toggleModalFields() {
      const type = document.getElementById('item-type').value;
      const loginFields = document.getElementById('login-fields');
      loginFields.classList.toggle('hidden', type !== 'login');
    }

    // --- 4. INITIALIZATION & EVENT LISTENERS ---
    document.addEventListener('DOMContentLoaded', () => {
      const isNew = !hasExistingVault();
      if (isNew) {
        document.getElementById('auth-title').textContent = 'Create Master Password';
        document.getElementById('auth-subtitle').textContent = 'Set a master passphrase to initialize your encrypted vault.';
        document.getElementById('confirm-pwd-group').classList.remove('hidden');
        document.getElementById('auth-submit-btn').textContent = 'Create Vault';
      }

      // Handle Login/Setup
      document.getElementById('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = document.getElementById('master-password').value;
        const confirmPwd = document.getElementById('confirm-password').value;
        const errDiv = document.getElementById('auth-error');
        errDiv.classList.add('hidden');

        try {
          if (isNew) {
            if (pwd !== confirmPwd) {
              throw new Error('Master passwords do not match.');
            }
            if (pwd.length < 8) {
              throw new Error('Master password must be at least 8 characters.');
            }
            const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)));
            currentKey = await CryptoEngine.deriveKey(pwd, new Uint8Array(salt));
            vaultItems = [];
            const encrypted = await CryptoEngine.encrypt(JSON.stringify([]), currentKey);
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ salt, payload: encrypted }));
          } else {
            const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
            currentKey = await CryptoEngine.deriveKey(pwd, new Uint8Array(stored.salt));
            const decryptedStr = await CryptoEngine.decrypt(stored.payload, currentKey);
            vaultItems = JSON.parse(decryptedStr);
          }

          // Switch views
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('dashboard-screen').classList.remove('hidden');
          document.getElementById('header-actions').classList.remove('hidden');
          renderItems();
        } catch (err) {
          errDiv.textContent = isNew ? err.message : 'Incorrect master password or corrupted data.';
          errDiv.classList.remove('hidden');
        }
      });

      // Lock Vault
      document.getElementById('btn-lock').addEventListener('click', () => {
        currentKey = null;
        vaultItems = [];
        document.getElementById('master-password').value = '';
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById('header-actions').classList.add('hidden');
      });

      // Filter tabs
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('bg-indigo-600', 'text-white');
            b.classList.add('text-slate-400');
          });
          e.target.classList.add('bg-indigo-600', 'text-white');
          e.target.classList.remove('text-slate-400');
          activeFilter = e.target.getAttribute('data-filter');
          renderItems();
        });
      });

      // Search input
      document.getElementById('search-input').addEventListener('input', renderItems);

      // Modal Controls
      document.getElementById('btn-add-item').addEventListener('click', () => {
        document.getElementById('modal-title').textContent = 'Add New Secret';
        document.getElementById('item-form').reset();
        document.getElementById('item-id').value = '';
        toggleModalFields();
        document.getElementById('item-modal').classList.remove('hidden');
      });

      document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('item-modal').classList.add('hidden');
      });
      document.getElementById('btn-cancel-modal').addEventListener('click', () => {
        document.getElementById('item-modal').classList.add('hidden');
      });
      document.getElementById('item-type').addEventListener('change', toggleModalFields);

      // Save Item
      document.getElementById('item-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('item-id').value || crypto.randomUUID();
        const type = document.getElementById('item-type').value;
        const title = document.getElementById('item-title').value;
        const username = document.getElementById('item-username').value;
        const password = document.getElementById('item-password').value;
        const notes = document.getElementById('item-notes').value;

        const existingIdx = vaultItems.findIndex(i => i.id === id);
        const itemObj = { id, type, title, username, password, notes, updatedAt: Date.now() };

        if (existingIdx >= 0) {
          vaultItems[existingIdx] = itemObj;
        } else {
          vaultItems.unshift(itemObj);
        }

        await saveVault();
        document.getElementById('item-modal').classList.add('hidden');
        renderItems();
        showToast('Secret saved and encrypted!');
      });

      // Password Generator
      document.getElementById('btn-generate-pwd').addEventListener('click', () => {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+";
        const array = new Uint32Array(18);
        crypto.getRandomValues(array);
        let pwd = "";
        for (let i = 0; i < array.length; i++) {
          pwd += chars[array[i] % chars.length];
        }
        document.getElementById('item-password').value = pwd;
        document.getElementById('item-password').type = 'text';
      });

      // Export Backup
      document.getElementById('btn-export').addEventListener('click', () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        const blob = new Blob([raw], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ciphervault-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      lucide.createIcons();
    });
  </script>
</body>
</html>
